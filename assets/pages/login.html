<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Alpha Leads Intelligence</title>
    <link rel="icon" href="/assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body data-title="title_login">
    <div class="login">
        <div class="login-card">
        <div class="lang" role="group" data-i18n-aria="aria_lang" aria-label="Language">
            <button type="button" data-lang="pt">PT</button>
        </div>

        <section class="login-art">
            <div class="brand">
                <img src="/assets/images/logo.png" alt="Alpha Tech">
                <div class="brand-name">Alpha Tech<small>Leads Intelligence</small></div>
            </div>
            <div>
                <h2><span data-i18n="hero_a">Find the right clients,</span> <em data-i18n="hero_b">at the right time.</em></h2>
                <p data-i18n="hero_p">Startup radar, intelligent analysis and sales follow-up in one place.</p>
            </div>
            <small data-i18n="copyright">© Alpha Tech Solutions - All Rights Reserved - 2026</small>
        </section>

        <section class="login-box">
            <form class="login-form" id="form-login" novalidate>
                <h1 data-i18n="login_h1">Welcome back</h1>
                <p data-i18n="login_sub">Sign in to access the dashboard.</p>

                <div class="erro-ui" id="erro" role="alert" hidden></div>

                <label class="campo">
                    <span data-i18n="email">Email</span>
                    <input type="email" name="email" autocomplete="username" required autofocus>
                </label>
                <label class="campo">
                    <span data-i18n="password">Password</span>
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>

                <p class="esqueci"><a class="link" href="/assets/pages/recover.html" data-i18n="forgot">Forgot your password?</a></p>

                <button class="btn btn-primary" id="btn-entrar" type="submit" data-i18n="signin">Sign in</button>
            </form>
        </section>
        </div>
    </div>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/auth.js"></script>
</body>
</html>
