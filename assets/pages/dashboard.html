<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Today · Alpha Leads Intelligence</title>
    <link rel="icon" href="/assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body data-page="hoje" data-title="title_hoje">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="main">
            <header class="topbar">
                <div>
                    <h1 id="titulo" data-i18n="nav_hoje">Today</h1>
                    <p id="data"></p>
                </div>
                <div class="topbar-right">
                    <div class="lang" role="group" data-i18n-aria="aria_lang" aria-label="Language">
                        <button type="button" data-lang="pt">PT</button>
                    </div>
                    <button class="burger" id="burger" data-i18n-aria="aria_menu" aria-label="Menu">
                        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                    </button>
                </div>
            </header>

            <main class="content">
                <section class="stats">
                    <div class="card stat">
                        <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.9H22l-6 4.6 2.3 7.1L12 16l-6.3 4.6L8 13.5 2 8.9h7.6z"/></svg></div>
                        <b id="st-novos">–</b><span data-i18n="st_novos">New leads</span>
                    </div>
                    <div class="card stat">
                        <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></div>
                        <b id="st-contactar">–</b><span data-i18n="st_contactar">Ready to contact</span>
                    </div>
                    <div class="card stat">
                        <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                        <b id="st-negociacao">–</b><span data-i18n="st_negociacao">In conversation</span>
                    </div>
                    <div class="card stat">
                        <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
                        <b id="st-ganhos">–</b><span data-i18n="st_ganhos">Deals closed</span>
                    </div>
                </section>

                <section class="grid-2">
                    <div class="col">
                        <div class="card">
                            <div class="card-head">
                                <h2 data-i18n="card_prior">Today's priorities</h2>
                                <a class="link" href="/assets/pages/leads.html" data-i18n="view_all">View all</a>
                            </div>
                            <div class="card-body" id="prioridades"><div class="vazio"><span data-i18n="loading">Loading…</span></div></div>
                        </div>

                        <div class="card">
                            <div class="card-head"><h2 id="followups-titulo" data-i18n="card_tasks">Tasks due</h2></div>
                            <div class="card-body" id="followups"><div class="vazio"><span data-i18n="loading">Loading…</span></div></div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-head"><h2 data-i18n="card_funil">Sales funnel</h2></div>
                        <div class="card-body"><div class="pipe" id="funil"></div></div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/contact.js"></script>
    <script src="/assets/js/dashboard.js"></script>
</body>
</html>
